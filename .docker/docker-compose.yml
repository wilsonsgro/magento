
services:

    elasticvue:
        image: cars10/elasticvue
        ports:
            - "8080:8080"
        volumes:
             - ./config/config.json:/usr/share/nginx/html/api/default_clusters.json
    php:
        container_name: php
        ##image: wilsonstart/php-82
        build: ./php-alpine
        privileged: true
        dns:
           - 8.8.8.8
        links:
            - mariadb
            - rabbitmq
        volumes:
            - ./config/alpine.conf:/etc/php82/php-fpm.d/www.conf
            - ./php-alpine/xdebug.ini:/etc/php82/conf.d/50_xdebug.ini
           #  - ./ssh/id_rsa:/root/.ssh/id_rsa
           #  - ./ssh/id_rsa.pub:/root/.ssh/id_rsa.pub
           #  - ./ssh/known_hosts:/root/.ssh/known_hosts
            - ./config/php.ini:/etc/php82/php.ini
            - ../www:/var/www
        extra_hosts:
            - "host.docker.internal:host-gateway"
        working_dir: /var/www
