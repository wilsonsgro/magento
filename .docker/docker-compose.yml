    mariadb:
        image: mariadb:10.4.1
        environment:
            - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
            - MYSQL_DATABASE=${MYSQL_DATABASE}
            - MYSQL_USER=${MYSQL_USER}
            - MYSQL_PASSWORD=${MYSQL_PASSWORD}
        volumes:
            - ./backup:/home
            - ./data:/var/lib/mysql
            - ./config/my.cnf:/etc/mysql/my.cnf
        working_dir: /home
        ports:
            - "3306:3306"
    redis:
        container_name: cache
        image: redislabs/redisearch
        privileged: true
        ports:
            - "6379"
        restart: always
        volumes:
          - 'redishmagento:/data'
    mailhog:
      image: mailhog/mailhog
      container_name: mailhog
      ports:
        - "8025:8025"
    nginx:
        container_name: nginx
        hostname: local.magento.it
        image: nginx:1.11
        environment:
            - ENABLE_LOG=0
        ports:
            - "80:80"
            - "443:443"
        depends_on:
            - php
        volumes_from:
           - php
        volumes:
            - ./config/magento.conf:/etc/nginx/sites-enabled/magento.conf
            - ./config/pwa.conf:/etc/nginx/sites-enabled/pwa.conf
            - ./config/nginx.conf:/etc/nginx/nginx.conf
        links:
            - php
    rabbitmq:
        image:  rabbitmq:3-management
        ports:
          - '15672:15672'
          - '5672:5672'
        hostname: rabbitmq    
        volumes:
          - 'rabbitmqhmagento:/var/lib/rabbitmq'
    elasticsearch:
        container_name: elasticsearch
        image: wilsonstart/elasticsearch-7.10.2
        environment:
          - ES_JAVA_OPTS=-Xms256m -Xmx512m
          - bootstrap.memory_lock=true
          - discovery.type=single-node
          - http.port=9200
          - http.cors.enabled=true
          - http.cors.allow-origin=*
          - http.cors.allow-headers=X-Requested-With,X-Auth-Token,Content-Type,Content-Length,Authorization
          - http.cors.allow-credentials=true
        volumes:
          - 'elasticsearchmagento:/usr/share/elasticsearch/data'
        working_dir: /usr/share/elasticsearch/data
        ports:
            - "9200:9200"
            - "9300:9300"
    nodejs:
        #build: ./nodejs
        image: wilsonstart/docker-nodejs
        user: root
        hostname: nodejs
        environment:
          - NODE_OPTIONS=--openssl-legacy-provider
        ports:
            #- "8081:8081"
            - "80"
        working_dir: /home/node/app
        command: "/usr/local/bin/yarn start"
        volumes:
             - ../www/node:/home/node/app
        # docker run -it -u root -p 8081:8081 -v /Users/wilsonsgro/Desktop/magento/www:/home/node/app  wilsonstart/docker-nodejs bash
        # --publish 8080:80
        # root@581c0d5b4e27:/home/node/app# npm --version
        # 10.9.2
        # root@581c0d5b4e27:/home/node/app# yarn --version
        # 1.22.22
        # root@581c0d5b4e27:/home/node/app# node --version
        # v22.15.0
volumes:
    elasticsearchmagento: {}
    redishmagento: {}
    rabbitmqhmagento: {}

